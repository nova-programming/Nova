name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      # pytest collects both unittest- and pytest-style tests; `unittest discover`
      # silently skipped the pytest-style modules.
      - name: Run test suite
        run: python -m pytest -q -rs

      - name: Nova smoke test — version
        run: python bootstrap/main.py --version

      - name: Nova smoke test — VM execution
        run: |
          mkdir -p ./ci-tmp
          printf 'print("Hello from Nova CI")\n' > ./ci-tmp/hello.nv
          python bootstrap/main.py dev ./ci-tmp/hello.nv

      - name: Native compilation (Windows) — compile, link, run
        if: runner.os == 'Windows'
        run: |
          printf 'print("Hello from Nova CI")\n' > ./ci-tmp/test_cc.nv
          python bootstrap/main.py build ./ci-tmp/test_cc.nv
          ./ci-tmp/test_cc.exe

      - name: Native compilation (Unix) — generate assembly, compile runtime, assemble + link
        if: runner.os != 'Windows'
        run: |
          printf 'print("Hello from Nova CI")\n' > ./ci-tmp/test_cc.nv
          python bootstrap/main.py build ./ci-tmp/test_cc.nv
          ./ci-tmp/test_cc

      - name: Diagnostics on native build failure (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          cat ./ci-tmp/test_cc.s 2>&1 | head -100 || true
          nm ./ci-tmp/test_cc 2>&1 | head -30 || true
          otool -tV ./ci-tmp/test_cc 2>&1 | head -40 || true

      - name: Self-hosted bootstrap — build stage1 compiler
        if: runner.os != 'Windows'
        run: |
          python bootstrap/main.py build nova.nv
          mv ./nova ./nova-stage1
          printf 'print("Self-hosted Nova OK")\n' > ./ci-tmp/selfhost.nv

      - name: Self-hosted bootstrap — stage1 compiles and runs a program
        if: runner.os != 'Windows'
        run: |
          ./nova-stage1 --version
          ./nova-stage1 build ./ci-tmp/selfhost.nv
          ./ci-tmp/selfhost

      - name: Self-hosted diagnostics on failure
        if: failure() && runner.os == 'macOS'
        run: |
          cat ./nova_diag.txt 2>&1 || true
          head -60 ./ci-tmp/selfhost.nv.s 2>&1 || true

      - name: Verify install.py imports cleanly
        run: python -c "import install; print('install.py OK')"

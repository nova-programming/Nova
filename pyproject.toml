[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nova-lang"
version = "0.8.0"
description = "Nova Programming Language compiler and Galaxy Package Manager"
readme = "README.md"
license = {text = "CC-BY-NC-4.0"}
requires-python = ">=3.10"

[project.scripts]
nova = "bootstrap.main:main"
galaxy = "_galaxy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bootstrap*", "galaxy*", "tools*", "nova_ast*", "compiler*", "parser*", "lexer*", "vm*", "modules*"]

[tool.setuptools]
py-modules = ["_galaxy"]

[tool.setuptools.package-data]
"*" = ["*.nv", "*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
